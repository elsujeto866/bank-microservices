// =============================================================================
// Infrastructure module conventions — the outermost ring.
//
// This is where the dirt lives, and that is by design: HTTP controllers, JPA
// entities, Kafka producers and consumers, Spring configuration, the main
// class. Everything the business rules must never know about.
//
// Frameworks are unrestricted here. That is the whole point of pushing them out
// to the edge.
// =============================================================================

import org.gradle.api.artifacts.VersionCatalogsExtension

plugins {
    id 'bank.java-conventions'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

dependencies {
    implementation platform(libs.findLibrary('spring-boot-bom').get())

    testImplementation platform(libs.findLibrary('spring-boot-bom').get())
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit runs the architecture rules the Gradle module graph cannot see:
    // package naming, annotation placement, "no cycles", and so on.
    testImplementation libs.findLibrary('archunit-junit5').get()
}

// -----------------------------------------------------------------------------
// Unit tests and integration tests are different tasks, on purpose.
//
// `test` runs everything that needs nothing but a JVM: milliseconds, no Docker,
// safe to run on every save. `integrationTest` runs the *IT classes, which start
// containers and take tens of seconds.
//
// Merging them punishes the fast tests for the slow ones. A suite that needs
// Docker to run at all is a suite people stop running locally — and a test
// nobody runs is worse than no test, because it also lies about coverage.
// -----------------------------------------------------------------------------
tasks.named('test', Test) {
    useJUnitPlatform()
    filter {
        excludeTestsMatching '*IT'
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs the *IT tests. Requires a working Docker environment (Testcontainers).'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*IT'
    }

    // Containers are slow and the results depend on a running daemon, so this
    // task is never considered up to date.
    outputs.upToDateWhen { false }

    shouldRunAfter tasks.named('test')
}
